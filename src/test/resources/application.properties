# Este arquivo substitui por completo o application.properties de src/main nos testes,
# entao tudo que o contexto precisa tem que estar declarado aqui.

# Banco em memoria: os testes nao dependem de um MySQL rodando na maquina.
spring.datasource.url=jdbc:h2:mem:testdb;MODE=MySQL;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop

# As migrations sao especificas de MySQL, entao nao rodam no H2.
spring.flyway.enabled=false

# Segredo de teste. O real vem da variavel de ambiente JWT_SECRET.
# HS256 exige chave de no minimo 32 bytes, senao o jjwt lanca WeakKeyException.
jwt.secret=chave-de-teste-somente-para-os-testes-automatizados
jwt.expiration=86400000